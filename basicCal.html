<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Calculator</title>
 <style>
   body {
     font-family: Arial, sans-serif;
     display: flex;
     justify-content: center;
     align-items: center;
     height: 100vh;
     margin: 0;
     background-color: #f4f4f4;
   }
   .calculator {
     background: #fff;
     padding: 20px;
     border-radius: 10px;
     box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
   }
   .display {
     width: 100%;
     height: 50px;
     margin-bottom: 10px;
     font-size: 1.5rem;
     text-align: right;
     padding-right: 10px;
     border: none;
     background-color: #f9f9f9;
   }
   .buttons {
     display: grid;
     grid-template-columns: repeat(4, 1fr);
     gap: 10px;
   }
   button {
     height: 50px;
     font-size: 1.2rem;
     border: none;
     border-radius: 5px;
     cursor: pointer;
   }
   button.operation {
     background-color: #ff9500;
     color: white;
   }
   button.equal {
     background-color: #34c759;
     color: white;
   }
   button.clear {
     background-color: #ff3b30;
     color: white;
   }
   button.number {
     background-color: #dcdcdc;
   }
 </style>
</head>
<body>
<div class="calculator">
 <input type="text" id="display" class="display" disabled>
 <div class="buttons">
   <button class="clear" onclick="clearDisplay()">C</button>
   <button class="operation" onclick="appendValue('/')">/</button>
   <button class="operation" onclick="appendValue('*')">*</button>
   <button class="operation" onclick="appendValue('-')">-</button>
   <button class="number" onclick="appendValue('7')">7</button>
   <button class="number" onclick="appendValue('8')">8</button>
   <button class="number" onclick="appendValue('9')">9</button>
   <button class="operation" onclick="appendValue('+')">+</button>
   <button class="number" onclick="appendValue('4')">4</button>
   <button class="number" onclick="appendValue('5')">5</button>
   <button class="number" onclick="appendValue('6')">6</button>
   <button class="number" onclick="appendValue('1')">1</button>
   <button class="number" onclick="appendValue('2')">2</button>
   <button class="number" onclick="appendValue('3')">3</button>
   <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
   <button class="number" onclick="appendValue('.')">.</button>
   <button class="equal" onclick="calculate()">=</button>
 </div>
</div>
<script>
    const display = document.getElementById("display")
    function appendValue(value){
        display.value += value
    }
    function clearDisplay(){
        display.value = ""
    }
    function calculate (){
        try {
            display.value = eval(display.value); // Evaluate the expression
        } catch (error) {
            display.value = "Error"; // Handle invalid expressions
        }
        
    }
</script>
</body>
</html>
